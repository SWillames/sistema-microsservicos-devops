name: CI

# Define quando a pipeline será executada automaticamente
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacao:
    name: Validar Estrutura e Infraestrutura
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Passo 1: Baixa o codigo do repositorio na maquina do GitHub Actions
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      # Passo 2: Valida se o arquivo docker-compose.yml possui sintaxe correta
      - name: Preparar variáveis de ambiente
        run: cp .env.example .env

      - name: Validar Arquivo Docker Compose
        run: docker compose config --quiet

  order-service-lint:
    name: Order Service / Estilo (Rubocop)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: service-orders

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with: 
          working-directory: service-orders
          bundler-cache: true

      - name: Executar Rubocop
        run: bin/rubocop -f github

  order-service-seguranca:
    name: Order Service / Segurança (Brakeman e bundler-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: service-orders

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: service-orders
          bundler-cache: true

      - name: Análise estática com Brakeman
        run: bin/brakeman --no-pager

      - name: Auditoria de dependências
        run: bin/bundler-audit
        
  testar-order-service:
    name: Testar Order Service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.ORDERS_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.ORDERS_DB_PASSWORD }}
          
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: service-orders

    env:
      RAILS_ENV: test
      ORDERS_DB_HOST: localhost
      ORDERS_DB_USER: ${{ secrets.ORDERS_DB_USER }}
      ORDERS_DB_PASSWORD: ${{ secrets.ORDERS_DB_PASSWORD }}
      

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Verificar secrets
        run: |
          if [ -z "$ORDERS_DB_USER" ]; then
            echo "::error::Secret ORDERS_DB_USER não configurado no repositório"
            exit 1
          fi
          if [ -z "$ORDERS_DB_PASSWORD" ]; then
            echo "::error::Secret ORDERS_DB_PASSWORD não configurado no repositório"
            exit 1
          fi

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: service-orders
          bundler-cache: true

      - name: Preparar Banco de Dados
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load
      
      - name: Executar Testes RSpec
        run: bundle exec rspec

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-order-service
          path: service-orders/coverage
          if-no-files-found: ignore
